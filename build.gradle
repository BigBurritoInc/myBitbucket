plugins {
    id 'org.jetbrains.kotlin.jvm' version '2.1.20'
    // Version pinned in settings.gradle, not here — see CLAUDE.md "Build".
    id 'org.jetbrains.intellij.platform'
}

group 'BigBurritoInc'
// Bump on every change intended for reinstall (0.7 -> 0.7.1 -> ...) — see CLAUDE.md "Versioning".
version '0.5.6'

dependencies {
    intellijPlatform {
        // Pinned SDK, not a local IDE install — see CLAUDE.md "Build" for why 2025.2.
        create 'IC', '2025.2'
        bundledPlugin 'Git4Idea'
    }

    // Replaces com.palominolabs.http:url-builder (JCenter shutdown) — see http.UrlBuilder.
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.2'

    testImplementation 'org.jetbrains.kotlin:kotlin-test-junit:2.1.20'
    testImplementation 'junit:junit:4.13.2'
}

// Puts the platform SDK on test runtime classpath too, not just compile — required for
// PanelRunner.kt to run standalone. See CLAUDE.md "PanelRunner".
sourceSets {
    test {
        runtimeClasspath += sourceSets.main.compileClasspath
    }
}

// --add-opens for PanelRunner.kt (JDK 17+ module system) — see CLAUDE.md "PanelRunner".
tasks.withType(JavaExec).configureEach {
    jvmArgs += [
            '--add-opens=java.base/java.lang=ALL-UNNAMED',
            '--add-opens=java.base/java.lang.reflect=ALL-UNNAMED',
            '--add-opens=java.base/java.util=ALL-UNNAMED',
            '--add-opens=java.base/java.util.concurrent=ALL-UNNAMED',
            '--add-opens=java.base/java.util.concurrent.atomic=ALL-UNNAMED',
            '--add-opens=java.base/java.text=ALL-UNNAMED',
            '--add-opens=java.base/java.nio=ALL-UNNAMED',
            '--add-opens=java.base/java.nio.charset=ALL-UNNAMED',
            '--add-opens=java.desktop/java.awt=ALL-UNNAMED',
            '--add-opens=java.desktop/java.awt.event=ALL-UNNAMED',
            '--add-opens=java.desktop/java.awt.image=ALL-UNNAMED',
            '--add-opens=java.desktop/java.awt.font=ALL-UNNAMED',
            '--add-opens=java.desktop/javax.swing=ALL-UNNAMED',
            '--add-opens=java.desktop/javax.swing.plaf.basic=ALL-UNNAMED',
            '--add-opens=java.desktop/javax.swing.text=ALL-UNNAMED',
            '--add-opens=java.desktop/javax.swing.text.html=ALL-UNNAMED',
            '--add-opens=java.desktop/sun.awt=ALL-UNNAMED',
            '--add-opens=java.desktop/sun.font=ALL-UNNAMED',
            '--add-opens=java.desktop/sun.java2d=ALL-UNNAMED',
            '--add-opens=java.desktop/sun.swing=ALL-UNNAMED',
            '--add-opens=java.desktop/sun.lwawt=ALL-UNNAMED',
            '--add-opens=java.desktop/sun.lwawt.macosx=ALL-UNNAMED',
    ]
}

// Platform requires Java 17 bytecode regardless of the JDK running Gradle.
kotlin {
    jvmToolchain(17)
}

intellijPlatform {
    pluginConfiguration {
        name = 'myBitbucket'
        version = project.version.toString()
        ideaVersion {
            sinceBuild = '233'
            untilBuild = null
        }
        changeNotes = """
          v0.5.6 The plugin now checks for updates more often when things are moving and backs off when
          they are not, instead of polling on a fixed timer.<br><br>
          v0.5.3 Settings, pull requests, and Checkout are now independent per project - opening
          a second project window no longer shares them with the first.<br><br>
          v0.5.1 Modernized the look and feel: redesigned Settings page, theme-aware colors and
          icons in the pull request list.<br><br>
          Settings now asks for a single "Repository URL" instead of three separate
          fields, with Access Token as the only way to sign in.<br><br>
          Added a pull request description view — expand a PR to read its full description
          in place.<br><br>
        """
    }
}
